openapi: 3.1.0
info:
  title: Dynamic Software Licensing (DSL) Canonical API
  version: 0.2.0-review-draft
  description: >
    Canonical DSL control-plane API. Generated from the DSL Best Practices document
    (source of truth): Chapter 10 (Canonical API Model) and Annex B (API Contracts).

    PATH STYLE: Google AIP-136 custom-method (colon) form (":renew", ":reissue",
    ":finalizeReissue") as specified consistently in Chapter 10.01 and Annex B. The
    reference implementation currently uses slash sub-resources ("/renew"); see
    release-readiness/01-spec-vs-implementation-deltas.md (D1).

    ERROR MODEL: RFC 9457 Problem Details (application/problem+json), per Chapter 10.08.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://lic.example.com
    description: Example control-plane base URL (placeholder)
tags:
  - name: leases
  - name: usage
  - name: keys
paths:
  /v1/leases:
    post:
      tags: [leases]
      operationId: issueLease
      summary: Issue a new lease
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueRequest' }
      responses:
        '201':
          description: Lease issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /v1/leases/{leaseId}:renew:
    parameters: [ { $ref: '#/components/parameters/LeaseId' } ]
    post:
      tags: [leases]
      operationId: renewLease
      summary: Renew an active lease
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenewRequest' }
      responses:
        '200':
          description: Lease renewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenewResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
  /v1/leases/{leaseId}:reissue:
    parameters: [ { $ref: '#/components/parameters/LeaseId' } ]
    post:
      tags: [leases]
      operationId: reissueLease
      summary: Initiate lease transfer (shadow phase)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReissueRequest' }
      responses:
        '200':
          description: Shadow lease created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReissueResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/leases/{leaseId}:finalizeReissue:
    parameters: [ { $ref: '#/components/parameters/LeaseId' } ]
    post:
      tags: [leases]
      operationId: finalizeReissue
      summary: Complete lease transfer (finalize phase)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinalizeReissueRequest' }
      responses:
        '200':
          description: Transfer completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalizeReissueResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
  /v1/leases/{leaseId}:
    parameters: [ { $ref: '#/components/parameters/LeaseId' } ]
    delete:
      tags: [leases]
      operationId: revokeLease
      summary: Revoke a lease
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeRequest' }
      responses:
        '204': { description: Lease revoked (no content) }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/usage-records:
    post:
      tags: [usage]
      operationId: submitUsageRecord
      summary: Submit a metered usage event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsageEvent' }
      responses:
        '202':
          description: Usage accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /.well-known/jwks.json:
    get:
      tags: [keys]
      operationId: getJwks
      summary: Retrieve public signing keys (JWKS)
      security: []
      responses:
        '200':
          description: JSON Web Key Set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }
components:
  parameters:
    LeaseId:
      name: leaseId
      in: path
      required: true
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 Problem Details error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Dimension:
      type: object
      properties:
        name: { type: string }
        quantity: { type: number }
      required: [name, quantity]
    IdentityEvidence:
      type: object
      properties:
        aws: { type: object, additionalProperties: true }
        kubernetes: { type: object, additionalProperties: true }
        x509: { type: object, additionalProperties: true }
        custom: { type: object, additionalProperties: true }
      additionalProperties: true
    Policy:
      type: object
      properties:
        renewBeforeSeconds: { type: integer }
        offlineGraceSeconds: { type: integer }
        onGraceExhausted: { type: string, enum: [DRAIN, DEGRADE, STOP] }
        heartbeatSeconds: { type: integer }
      required: [renewBeforeSeconds, offlineGraceSeconds, onGraceExhausted]
    IssueRequest:
      type: object
      properties:
        app: { type: string }
        tenantId: { type: string }
        isvId: { type: string }
        dimensions: { type: array, items: { $ref: '#/components/schemas/Dimension' } }
        licenseModality: { type: string }
        identityEvidence: { $ref: '#/components/schemas/IdentityEvidence' }
        workId: { type: string }
        environment: { type: string }
        client: { type: object, additionalProperties: true }
        policyHints: { type: object, additionalProperties: true }
      required: [app, tenantId, identityEvidence, workId]
    IssueResponse:
      type: object
      properties:
        leaseId: { type: string }
        app: { type: string }
        tenantId: { type: string }
        token: { type: string }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        licenseModality: { type: string }
        dimensions: { type: array, items: { $ref: '#/components/schemas/Dimension' } }
        boundIdentity: { type: object, additionalProperties: true }
        policy: { $ref: '#/components/schemas/Policy' }
      required: [leaseId, token, expiresAt, policy]
    RenewRequest:
      type: object
      properties:
        identityEvidence: { $ref: '#/components/schemas/IdentityEvidence' }
        workId: { type: string }
      required: [identityEvidence]
    RenewResponse:
      type: object
      properties:
        leaseId: { type: string }
        token: { type: string }
        expiresAt: { type: string, format: date-time }
      required: [leaseId, token, expiresAt]
    ReissueRequest:
      type: object
      properties:
        toIdentityEvidence: { $ref: '#/components/schemas/IdentityEvidence' }
        toWorkId: { type: string }
      required: [toIdentityEvidence, toWorkId]
    ReissueResponse:
      type: object
      properties:
        reissueId: { type: string }
        cutoverToken: { type: string }
        toLease:
          type: object
          properties:
            leaseId: { type: string }
            token: { type: string }
            expiresAt: { type: string, format: date-time }
            dimensions: { type: array, items: { $ref: '#/components/schemas/Dimension' } }
            policy: { $ref: '#/components/schemas/Policy' }
      required: [reissueId, cutoverToken, toLease]
    FinalizeReissueRequest:
      type: object
      properties:
        reissueId: { type: string }
        cutoverToken: { type: string }
      required: [reissueId, cutoverToken]
    FinalizeReissueResponse:
      type: object
      properties:
        state: { type: string }
        revoked: { type: string }
      required: [state, revoked]
    RevokeRequest:
      type: object
      properties:
        reason: { type: string }
      required: [reason]
    UsageEvent:
      type: object
      properties:
        leaseId: { type: string }
        tenantId: { type: string }
        isvId: { type: string }
        productId: { type: string }
        dimension: { type: string }
        quantity: { type: number }
        granularity: { type: string }
        timestamp: { type: string, format: date-time }
        workId: { type: string }
      required: [leaseId, tenantId, productId, dimension, quantity, granularity, timestamp, workId]
    Jwks:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty: { type: string }
              kid: { type: string }
              use: { type: string }
              alg: { type: string }
              n: { type: string }
              e: { type: string }
            required: [kty, kid, use, alg]
      required: [keys]
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        category: { type: string }
        retryable: { type: boolean }
      required: [type, title, status, detail]
security:
  - bearerAuth: []
