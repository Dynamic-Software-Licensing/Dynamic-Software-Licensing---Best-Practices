name: Check PR Basics

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-pr-description:
    name: Validate PR basics
    runs-on: ubuntu-latest

    steps:
      - name: Check PR body presence
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ]; then
            echo "❌ PR description is empty. Fill in the PR template."
            exit 1
          fi

          LENGTH=${#PR_BODY}
          if [ "$LENGTH" -lt 30 ]; then
            echo "❌ PR description is too short ($LENGTH characters). Add a short summary."
            exit 1
          fi

          echo "✅ PR description looks sufficient ($LENGTH characters)."

      - name: Check issue link
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$PR_BODY" | grep -qiE '(closes|fixes|resolves|related to) #[0-9]+'; then
            echo "✅ PR links to an issue."
          else
            echo "⚠️  No issue link found."
            echo "   Use 'Closes #<issue>' or 'Related to #<issue>' in the PR description."
            echo "   This is a warning only."
          fi

      - name: Check review-state selection
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          COUNT=$(printf "%s" "$PR_BODY" | grep -cE '^\- \[[xX]\] (Draft / work in progress|Ready for review)' || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "⚠️  No review state selected in the template."
            echo "   This is a warning only."
          else
            echo "✅ Review state provided."
          fi
