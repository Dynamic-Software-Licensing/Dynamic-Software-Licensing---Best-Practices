name: Publish PDF Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pdf-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build and publish PDF release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine output filenames
        id: output_filenames
        run: |
          version=$(grep -m1 -E '^## \[[^]]+\] - ' CHANGELOG.md | sed -E 's/^## \[([^]]+)\] - .*$/\1/')
          if [ -z "$version" ]; then
            echo "Could not determine document version from CHANGELOG.md" >&2
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = 'tag' ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            tagged_version="${GITHUB_REF_NAME#v}"
            if [ "$tagged_version" != "$version" ]; then
              echo "Tag version ${tagged_version} does not match CHANGELOG version ${version}" >&2
              exit 1
            fi

            pdf_file="dynamic-software-licensing-best-practices-v${tagged_version}.pdf"
            release_tag="${GITHUB_REF_NAME}"
            release_title="Dynamic Software Licensing Best Practices v${tagged_version}"
            prerelease=false
            release_notes_intro="Automatically generated PDF release from tag ${GITHUB_REF_NAME}."
            release_assets="_build/${pdf_file}"
            release_assets_note="- ${pdf_file}"
          else
            pdf_file="dynamic-software-licensing-best-practices-v${version}.pdf"
            release_tag="latest"
            release_title="Dynamic Software Licensing Best Practices ${version}"
            prerelease=false
            release_notes_intro="Automatically generated PDF release from the main branch."
            release_assets="_build/dynamic-software-licensing-best-practices-latest.pdf"
            release_assets_note="- dynamic-software-licensing-best-practices-latest.pdf"
          fi

          echo "PDF_FILE=$pdf_file" >> "$GITHUB_ENV"
          echo "LATEST_PDF=dynamic-software-licensing-best-practices-latest.pdf" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$release_title" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_INTRO=$release_notes_intro" >> "$GITHUB_ENV"
          echo "RELEASE_ASSETS=$release_assets" >> "$GITHUB_ENV"
          echo "RELEASE_ASSETS_NOTE=$release_assets_note" >> "$GITHUB_ENV"
          echo "pdf_file=$pdf_file" >> "$GITHUB_OUTPUT"
          echo "latest_pdf=dynamic-software-licensing-best-practices-latest.pdf" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_title=$release_title" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Build combined Markdown source
        run: |
          python3 .github/scripts/build_review_draft.py \
            --manifest .github/release-pdf-manifest.txt \
            --output _build/review-draft.md \
            --document-title "Dynamic Software Licensing" \
            --document-subtitle "Best Practices" \
            --document-status "Reviewed Draft"

      - name: Render Mermaid diagrams for PDF
        run: |
          rm -rf _build/mermaid

          python3 .github/scripts/prepare_mermaid_diagrams.py \
            --input _build/review-draft.md \
            --output _build/review-draft.md \
            --assets-dir _build/mermaid

          cat > _build/puppeteer-config.json <<'EOF'
          {
            "args": [
              "--no-sandbox",
              "--disable-setuid-sandbox"
            ]
          }
          EOF

          if ls _build/mermaid/*.mmd >/dev/null 2>&1; then
            for file in _build/mermaid/*.mmd; do
              output="${file%.mmd}.png"
              npx --yes @mermaid-js/mermaid-cli@10.9.1 -i "$file" -o "$output" -b transparent -s 2 -p _build/puppeteer-config.json
            done
          fi

      - name: Render PDF with Pandoc
        uses: docker://pandoc/latex:3.5
        with:
          args: >-
            --from=markdown+raw_tex
            --standalone
            --resource-path=.:_build
            --output=_build/${{ steps.output_filenames.outputs.pdf_file }}
            _build/review-draft.md

      - name: Prepare release assets
        run: |
          cp "_build/${PDF_FILE}" "_build/${LATEST_PDF}"

      - name: Publish PDF release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set_release_flags() {
            tag_name="$1"
            prerelease_flag="$2"
            release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag_name}" --jq '.id')
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F prerelease="${prerelease_flag}" >/dev/null
          }

          notes=$(cat <<EOF
          ${RELEASE_NOTES_INTRO}

          Assets:
          ${RELEASE_ASSETS_NOTE}
          EOF
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            if [ "${PRERELEASE}" = 'true' ]; then
              gh release edit "${RELEASE_TAG}" \
                --title "${RELEASE_TITLE}" \
                --notes "$notes" \
                --prerelease
            else
              gh release edit "${RELEASE_TAG}" \
                --title "${RELEASE_TITLE}" \
                --notes "$notes"
            fi
          else
            if [ "${PRERELEASE}" = 'true' ]; then
              gh release create "${RELEASE_TAG}" \
                --target "${GITHUB_SHA}" \
                --title "${RELEASE_TITLE}" \
                --notes "$notes" \
                --prerelease
            else
              gh release create "${RELEASE_TAG}" \
                --target "${GITHUB_SHA}" \
                --title "${RELEASE_TITLE}" \
                --notes "$notes"
            fi
          fi

          gh release upload "${RELEASE_TAG}" \
            ${RELEASE_ASSETS} \
            --clobber

          set_release_flags "${RELEASE_TAG}" false

          if [ "${GITHUB_REF_TYPE}" = 'tag' ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            latest_notes=$(cat <<EOF
          Automatically generated PDF release tracking the current published baseline.

          Assets:
          - dynamic-software-licensing-best-practices-latest.pdf
          EOF
            )

            if gh release view latest >/dev/null 2>&1; then
              gh release edit latest \
                --title "Dynamic Software Licensing Best Practices ${GITHUB_REF_NAME#v}" \
                --notes "$latest_notes"
            else
              gh release create latest \
                --target "${GITHUB_SHA}" \
                --title "Dynamic Software Licensing Best Practices ${GITHUB_REF_NAME#v}" \
                --notes "$latest_notes"
            fi

            gh release upload latest \
              "_build/${LATEST_PDF}" \
              --clobber

            set_release_flags latest false
          fi