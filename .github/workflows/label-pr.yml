name: Auto-Label PR (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply labels based on changed files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
