name: Build Review Draft PDF

on:
  workflow_dispatch:
    inputs:
      document_profile:
        description: Choose whether to build a review-facing PDF or a leaner release-oriented PDF
        required: true
        default: release
        type: choice
        options:
          - review
          - release

jobs:
  build-review-pdf:
    name: Assemble and render review draft PDF
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine output filenames
        run: |
          version=$(grep -m1 -E '^## \[[^]]+\] - ' CHANGELOG.md | sed -E 's/^## \[([^]]+)\] - .*$/\1/')
          if [ -z "$version" ]; then
            echo "Could not determine document version from CHANGELOG.md" >&2
            exit 1
          fi

          release_version="${version%-review-draft}"

          if [ "${{ inputs.document_profile }}" = 'review' ]; then
            pdf_file="dynamic-software-licensing-best-practices-v${version}.pdf"
            artifact_name="dynamic-software-licensing-best-practices-v${version}-pdf"
          else
            pdf_file="dynamic-software-licensing-best-practices-v${release_version}.pdf"
            artifact_name="dynamic-software-licensing-best-practices-v${release_version}-pdf"
          fi

          echo "PDF_FILE=$pdf_file" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"

      - name: Build combined Markdown source
        run: |
          manifest=.github/review-pdf-manifest.txt

          if [ "${{ inputs.document_profile }}" = 'release' ]; then
            manifest=.github/release-pdf-manifest.txt
          fi

          cmd=(python3 .github/scripts/build_review_draft.py \
            --manifest "$manifest" \
            --output _build/review-draft.md \
            --document-title "Dynamic Software Licensing" \
            --document-subtitle "Best Practices" \
            --document-status "Reviewed Draft")

          "${cmd[@]}"

      - name: Render Mermaid diagrams for PDF
        run: |
          rm -rf _build/mermaid

          python3 .github/scripts/prepare_mermaid_diagrams.py \
            --input _build/review-draft.md \
            --output _build/review-draft.md \
            --assets-dir _build/mermaid

          cat > _build/puppeteer-config.json <<'EOF'
          {
            "args": [
              "--no-sandbox",
              "--disable-setuid-sandbox"
            ]
          }
          EOF

          if ls _build/mermaid/*.mmd >/dev/null 2>&1; then
            for file in _build/mermaid/*.mmd; do
              output="${file%.mmd}.png"
              npx --yes @mermaid-js/mermaid-cli@10.9.1 -i "$file" -o "$output" -b transparent -s 2 -p _build/puppeteer-config.json
            done
          fi

      - name: Render PDF with Pandoc
        uses: docker://pandoc/latex:3.5
        with:
          args: >-
            --from=markdown+raw_tex
            --standalone
            --resource-path=.:_build
            --output=_build/${{ env.PDF_FILE }}
            _build/review-draft.md

      - name: Upload review draft artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            _build/review-draft.md
            _build/${{ env.PDF_FILE }}