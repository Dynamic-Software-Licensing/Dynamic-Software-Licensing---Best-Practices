name: Validate Chapter Status Fields

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths:
      - 'best-practices/**/00-index.md'

jobs:
  validate-status:
    name: Check status fields in changed chapter index files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed chapter index files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" -- 'best-practices/**/00-index.md' | xargs)
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"

          if [ -z "$CHANGED" ]; then
            echo "ℹ️  No changed chapter index files in this PR."
          else
            echo "Changed files: $CHANGED"
          fi

      - name: Run status field validation
        if: steps.changed.outputs.files != ''
        run: python3 .github/scripts/validate_status.py ${{ steps.changed.outputs.files }}
