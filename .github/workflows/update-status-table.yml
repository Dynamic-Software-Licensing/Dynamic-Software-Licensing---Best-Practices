name: Auto-Update Chapter Status Table

on:
  push:
    branches:
      - main
    paths:
      - 'recommendation/**/00-index.md'

permissions:
  contents: write

jobs:
  update-status-table:
    name: Regenerate status overview in recommendation/index.md
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update status table
        run: python3 .github/scripts/update_status_table.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recommendation/index.md
          if git diff --cached --quiet; then
            echo "ℹ️  No changes to status table — skipping commit."
          else
            git commit -m "chore: auto-update chapter status overview [skip ci]"
            git push
          fi
